<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno Online</title>
</head>
<body>
    <main class="main-content">
        <article class="card">
        <header class="headerlogin">
      <img src="/learn.svg" width="70" alt="Logotipo da aplicação"/>
      <h1>Aluno Online</h1>
      </header>
      <form class="login">
      <label for="email">E-mail</label>
      <input class="input" type="string" id="email" name="email"/>
      <p class="erro" id="emailErro"></p>
      <label for="senha">Senha</label>
      <input class="input" type="password" id="senha" name="senha"/>
      <p class="erro" id="senhaErro"></p>
      <button class="input" type="submit">Entrar</button>
      </form>
      </article>
      <h2 class="h2">© 2026. Todos os direitos reservados.</h2>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
